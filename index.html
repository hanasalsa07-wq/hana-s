<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Animasi: Struktur Atom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1519;--card:#122328;--ink:#e8f1f2;--mut:#8fa7ac;--line:#2a4248;--ac:#5de0c8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:960px}
h1{font-size:1.5rem;margin:0 0 12px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0f1e24}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
#big{position:absolute;inset:0;margin:auto;width:88px;height:88px;border-radius:50%;border:0;background:var(--ac);color:#06302a;font-size:34px;cursor:pointer}
#sub{margin-top:10px;min-height:3.2em;padding:10px 14px;background:var(--card);border-radius:10px;line-height:1.5}
.ctl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
button.b{font:inherit;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.b:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:#06302a;border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--ac)}
#time{color:var(--mut);font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
label{color:var(--mut);display:flex;align-items:center;gap:6px;font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<main>
<h1>Struktur Atom</h1>
<div class="stage">
  <canvas id="cv"></canvas>
  <button id="big" aria-label="Putar video">▶</button>
</div>
<div id="sub" aria-live="polite"></div>
<div class="ctl">
  <button class="b" id="play">Putar</button>
  <button class="b" id="restart">Dari awal</button>
  <input type="range" id="seek" min="0" value="0" step="1" aria-label="Posisi video">
  <span id="time">0:00 / 0:00</span>
  <label><input type="checkbox" id="snd" checked> Suara narasi</label>
</div>
<div class="chips" id="chips"></div>
</main>

<script>
const W=960,H=540,$=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const C={bg:'#0f1e24',ink:'#e8f1f2',mut:'#8fa7ac',p:'#ff6b5e',n:'#9fb0b5',e:'#5cc4ff',ac:'#5de0c8',ring:'#2f525b'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));

// ---------- alat gambar ----------
function circ(x,y,r,fill,stroke,lw){ctx.beginPath();ctx.arc(x,y,r,0,7);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}}
function txt(s,x,y,size,col,al,w){ctx.font=(w||500)+' '+size+'px "Instrument Sans",system-ui,sans-serif';ctx.fillStyle=col||C.ink;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function nucleus(cx,cy,p,n,pr){const tot=p+n,step=pr*1.55*.62;let acc=0;
  for(let i=0;i<tot;i++){acc+=p;let isP=false;if(acc>=tot){acc-=tot;isP=true}
    const g=i*2.39996,r=Math.sqrt(i)*step;circ(cx+Math.cos(g)*r,cy+Math.sin(g)*r,pr,isP?C.p:C.n,C.bg,1)}}
function orbit(cx,cy,r,n,sp,lt,a,ph){ctx.globalAlpha=a;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.strokeStyle=C.ring;ctx.lineWidth=1.5;ctx.stroke();
  for(let k=0;k<n;k++){const g=(ph||0)+lt*sp+k*6.2832/n;circ(cx+Math.cos(g)*r,cy+Math.sin(g)*r,6,C.e,C.bg,1)}ctx.globalAlpha=1}
function title(s){txt(s,480,48,34,C.ink,'center',700)}

// ---------- adegan: d = durasi (detik), n = narasi, l = label tombol ----------
const SCENES=[
{d:6,l:'Judul',n:'Selamat datang. Pada video ini kita akan mempelajari struktur atom.',f:lt=>{
  const a=prog(lt,0,1.5);ctx.globalAlpha=a;nucleus(480,170,3,4,7);
  orbit(480,170,65,2,1.6,lt,a);orbit(480,170,110,1,1,lt,a);
  ctx.globalAlpha=a;txt('Struktur Atom',480,340,64,C.ink,'center',700);
  txt('Kimia SMA · Kelas X',480,400,26,C.mut);ctx.globalAlpha=1}},

{d:14,l:'Model atom',n:'Model atom berkembang dari bola pejal Dalton, model roti kismis Thomson, model inti atom Rutherford, hingga model kulit Bohr.',f:lt=>{
  const st=Math.min(3,Math.floor(lt/3.5)),l=lt-st*3.5,a=prog(l,0,.6);
  const N=[['Dalton','Atom adalah bola pejal yang tidak dapat dibagi'],['Thomson','Bola bermuatan positif dengan elektron tertanam'],['Rutherford','Inti kecil bermuatan positif, elektron di sekitar inti'],['Bohr','Elektron mengorbit pada kulit dengan energi tertentu']];
  title('Perkembangan model atom');ctx.globalAlpha=a;
  if(st==0)circ(480,250,95,'#3b6a76',C.ac,2);
  if(st==1){circ(480,250,95,'#7a3a3a','#ff9a8f',2);for(let k=0;k<8;k++){const g=k*.785+.3,r=k%2?58:30;circ(480+Math.cos(g)*r,250+Math.sin(g)*r,9,C.e)}}
  if(st==2){circ(480,250,9,C.p);for(let k=0;k<3;k++){const g=lt*1.3+k*2.09;circ(480+Math.cos(g)*(110+k*14),250+Math.sin(g*1.3)*80,8,C.e)}}
  if(st==3){nucleus(480,250,3,4,6);orbit(480,250,55,2,2,lt,a);orbit(480,250,100,1,1.2,lt,a)}
  ctx.globalAlpha=1;txt(N[st][0],480,385,36,C.ac,'center',700);txt(N[st][1],480,430,22,C.mut);
  for(let i=0;i<4;i++)circ(432+i*32,495,6,i==st?C.ac:C.ring)}},

{d:14,l:'Partikel',n:'Atom tersusun dari proton bermuatan positif, neutron tidak bermuatan, dan elektron bermuatan negatif. Proton dan neutron berada di inti, elektron mengelilingi inti.',f:lt=>{
  title('Partikel penyusun atom');nucleus(240,290,6,6,13);
  orbit(240,290,85,2,1.8,lt,1);orbit(240,290,140,4,1,lt,1);
  const I=[['Proton (p⁺)','Muatan +1 · massa 1 sma','Berada di inti',C.p,2],['Neutron (n)','Tidak bermuatan · massa 1 sma','Berada di inti',C.n,5],['Elektron (e⁻)','Muatan −1 · massa ≈ 1/1836 sma','Mengelilingi inti',C.e,8]];
  I.forEach((it,i)=>{const y=170+i*100;ctx.globalAlpha=prog(lt,it[4],it[4]+.6);
    circ(520,y,14,it[3]);txt(it[0],555,y-14,28,C.ink,'left',700);txt(it[1],555,y+14,19,C.mut,'left');txt(it[2],555,y+38,19,C.mut,'left')});
  ctx.globalAlpha=1}},

{d:13,l:'Notasi atom',n:'Notasi atom menuliskan nomor massa di kiri atas dan nomor atom di kiri bawah. Jumlah proton sama dengan nomor atom. Neutron sama dengan nomor massa dikurangi nomor atom.',f:lt=>{
  title('Notasi atom');const a=prog(lt,0,.8);ctx.globalAlpha=a;
  txt('Na',320,260,150,C.ink,'center',700);txt('23',235,195,54,C.p,'right',700);txt('11',235,320,54,C.e,'right',700);
  txt('A = nomor massa (proton + neutron)',300,400,20,C.mut);txt('Z = nomor atom (jumlah proton)',300,432,20,C.mut);
  const R=[['Proton = Z = 11',C.p,2],['Elektron = Z = 11 (atom netral)',C.e,5],['Neutron = A − Z = 23 − 11 = 12',C.n,8]];
  R.forEach((r,i)=>{ctx.globalAlpha=prog(lt,r[2],r[2]+.6);circ(500,170+i*90,10,r[1]);txt(r[0],525,170+i*90,28,C.ink,'left')});
  ctx.globalAlpha=1}},

{d:16,l:'Konfigurasi',n:'Pada model Bohr, elektron berada di kulit. Natrium memiliki konfigurasi elektron dua, delapan, satu, sehingga elektron valensinya satu dan berada di golongan satu A.',f:lt=>{
  title('Model Bohr: atom natrium (Na)');
  nucleus(480,300,11,12,7);
  const S=[[60,2,1.5,2,'Kulit K: 2 elektron'],[110,8,.9,5,'Kulit L: 8 elektron'],[160,1,.6,8,'Kulit M: 1 elektron']];
  S.forEach((s,i)=>{const a=prog(lt,s[3],s[3]+.8);orbit(480,300,s[0],s[1],s[2],lt,a);ctx.globalAlpha=a;txt(s[4],40,200+i*50,24,C.ink,'left');ctx.globalAlpha=1});
  const b=prog(lt,11,11.8);ctx.globalAlpha=b;txt('Konfigurasi: 2 8 1',820,230,26,C.ac,'center',700);
  txt('Elektron valensi = 1',820,275,24,C.ink);txt('Golongan IA',820,315,24,C.ink);ctx.globalAlpha=1}},

{d:14,l:'Isotop',n:'Isotop adalah atom unsur yang sama dengan jumlah proton sama, tetapi jumlah neutron berbeda, seperti karbon dua belas dan karbon empat belas.',f:lt=>{
  title('Isotop');
  const A=[[240,6,6,'¹²C',1],[720,6,8,'¹⁴C',3]];
  A.forEach(m=>{const a=prog(lt,m[4],m[4]+.8);ctx.globalAlpha=a;nucleus(m[0],290,m[1],m[2],10);
    orbit(m[0],290,80,2,1.8,lt,a);orbit(m[0],290,125,4,1,lt,a);ctx.globalAlpha=a;
    txt(m[3],m[0],110,46,C.ac,'center',700);txt('Proton '+m[1]+' · Neutron '+m[2],m[0],455,24,C.ink);ctx.globalAlpha=1});
  const b=prog(lt,6,6.8);ctx.globalAlpha=b;txt('Nomor atom sama',480,265,22,C.ink);txt('Nomor massa beda',480,305,22,C.p);ctx.globalAlpha=1}},

{d:8,l:'Rangkuman',n:'Itulah rangkuman struktur atom. Selamat belajar!',f:lt=>{
  title('Rangkuman');
  const L=['Atom terdiri dari proton, neutron, dan elektron','Nomor atom (Z) = jumlah proton','Nomor massa (A) = proton + neutron','Elektron mengisi kulit: K = 2, L = 8, M = 18, …','Isotop: proton sama, neutron berbeda'];
  L.forEach((s,i)=>{ctx.globalAlpha=prog(lt,.8+i*1.2,1.4+i*1.2);circ(110,140+i*72,7,C.ac);txt(s,135,140+i*72,30,C.ink,'left')});
  ctx.globalAlpha=1}}
];
const STARTS=[];let TOTAL=0;SCENES.forEach(s=>{STARTS.push(TOTAL);TOTAL+=s.d});

// ---------- pemutar ----------
let t=0,playing=false,last=0,cur=-1;
const seek=$('seek');seek.max=Math.round(TOTAL*10);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
SCENES.forEach((s,i)=>{const b=document.createElement('button');b.className='b';b.textContent=(i+1)+'. '+s.l;b.onclick=()=>{t=STARTS[i];cur=-1;if(!playing)setPlay(true)};$('chips').appendChild(b)});

function say(i){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
  if(!$('snd').checked||!playing)return;const u=new SpeechSynthesisUtterance(SCENES[i].n);u.lang='id-ID';speechSynthesis.speak(u)}
function setPlay(v){playing=v;if(v&&t>=TOTAL-.05){t=0;cur=-1}
  $('play').textContent=v?'Jeda':'Putar';$('big').style.display=v?'none':'block';$('big').textContent=t>=TOTAL-.05?'↻':'▶';
  if(v)say(Math.max(cur,0));else if('speechSynthesis' in window)speechSynthesis.cancel()}

function render(){
  let i=SCENES.length-1;while(i>0&&t<STARTS[i])i--;
  if(i!==cur){cur=i;$('sub').textContent=SCENES[i].n;say(i);
    [...$('chips').children].forEach((b,k)=>b.classList.toggle('on',k===i))}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  SCENES[i].f(t-STARTS[i]);ctx.globalAlpha=1;
  seek.value=Math.round(t*10);$('time').textContent=fmt(t)+' / '+fmt(TOTAL)}

function frame(ts){
  if(playing){t+=Math.min(.1,(ts-last)/1000);if(t>=TOTAL){t=TOTAL-.001;setPlay(false);$('big').textContent='↻'}}
  last=ts;render();requestAnimationFrame(frame)}

$('play').onclick=$('big').onclick=()=>setPlay(!playing);
$('restart').onclick=()=>{t=0;cur=-1;setPlay(true)};
seek.oninput=()=>{t=seek.value/10;cur=-1};
$('snd').onchange=()=>{if($('snd').checked)say(Math.max(cur,0));else if('speechSynthesis' in window)speechSynthesis.cancel()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(e.target.tagName)){e.preventDefault();setPlay(!playing)}});
requestAnimationFrame(frame);
</script>
</body>
</html>
